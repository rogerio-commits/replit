openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ulimax — Sistema de Controle de Projetos
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: members
    description: Team member management
  - name: dashboard
    description: Dashboard and summary endpoints
  - name: users
    description: User and role management
  - name: calendario
    description: Installation calendar events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get task statistics for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, review, done]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: assignedTo
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List team members
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get overall dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent tasks and project updates
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "401":
          description: Unauthorized

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (gestor only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUser"
        "403":
          description: Forbidden

  /users/{id}:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update user role (gestor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /installation-events:
    get:
      operationId: listInstallationEvents
      tags: [calendario]
      summary: List installation events
      parameters:
        - name: month
          in: query
          description: "Filter by month in YYYY-MM format"
          schema:
            type: string
      responses:
        "200":
          description: List of installation events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstallationEvent"
    post:
      operationId: createInstallationEvent
      tags: [calendario]
      summary: Create an installation event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationEvent"

  /installation-events/{id}:
    patch:
      operationId: updateInstallationEvent
      tags: [calendario]
      summary: Update an installation event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationEventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationEvent"
        "404":
          description: Not found
    delete:
      operationId: deleteInstallationEvent
      tags: [calendario]
      summary: Delete an installation event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      required: [id, name, status, priority, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        finalDate:
          type: ["string", "null"]
        producaoStartDate:
          type: ["string", "null"]
        producaoEndDate:
          type: ["string", "null"]
        producaoFinalDate:
          type: ["string", "null"]
        medicaoDate:
          type: ["string", "null"]
        instalacaoStartDate:
          type: ["string", "null"]
        materialType:
          type: ["string", "null"]
          enum: [madeira, aluminio]
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [name, status, priority]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: string
        endDate:
          type: string
        finalDate:
          type: string
        producaoStartDate:
          type: string
        producaoEndDate:
          type: string
        producaoFinalDate:
          type: string
        medicaoDate:
          type: string
        instalacaoStartDate:
          type: string
        materialType:
          type: string
          enum: [madeira, aluminio]

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        priority:
          type: string
          enum: [low, medium, high]
        startDate:
          type: string
        endDate:
          type: string
        finalDate:
          type: string
        producaoStartDate:
          type: string
        producaoEndDate:
          type: string
        producaoFinalDate:
          type: string
        medicaoDate:
          type: string
        instalacaoStartDate:
          type: string
        materialType:
          type: string
          enum: [madeira, aluminio]

    ProjectStats:
      type: object
      required: [projectId, total, todo, inProgress, review, done, overdue]
      properties:
        projectId:
          type: integer
        total:
          type: integer
        todo:
          type: integer
        inProgress:
          type: integer
        review:
          type: integer
        done:
          type: integer
        overdue:
          type: integer

    Task:
      type: object
      required: [id, projectId, title, status, priority, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assignedTo:
          type: ["integer", "null"]
        assigneeName:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string

    TaskInput:
      type: object
      required: [projectId, title, status, priority]
      properties:
        projectId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assignedTo:
          type: integer
        dueDate:
          type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high]
        assignedTo:
          type: integer
        dueDate:
          type: string
        projectId:
          type: integer

    Member:
      type: object
      required: [id, name, role, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    MemberInput:
      type: object
      required: [name, role, email]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    MemberUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    DashboardSummary:
      type: object
      required: [totalProjects, activeProjects, completedProjects, totalTasks, doneTasks, overdueTasks, totalMembers, projectsByStatus, tasksByStatus, tasksByPriority]
      properties:
        totalProjects:
          type: integer
        activeProjects:
          type: integer
        completedProjects:
          type: integer
        totalTasks:
          type: integer
        doneTasks:
          type: integer
        overdueTasks:
          type: integer
        totalMembers:
          type: integer
        projectsByStatus:
          type: object
          properties:
            a_iniciar: { type: integer }
            em_projeto: { type: integer }
            em_aprovacao: { type: integer }
            em_producao: { type: integer }
            aguardando_instalacao: { type: integer }
            em_instalacao: { type: integer }
          required: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        tasksByStatus:
          type: object
          properties:
            todo: { type: integer }
            in_progress: { type: integer }
            review: { type: integer }
            done: { type: integer }
          required: [todo, in_progress, review, done]
        tasksByPriority:
          type: object
          properties:
            low: { type: integer }
            medium: { type: integer }
            high: { type: integer }
          required: [low, medium, high]

    ActivityItem:
      type: object
      required: [id, type, title, status, priority, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [task, project]
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        projectName:
          type: ["string", "null"]
        createdAt:
          type: string

    UserRole:
      type: string
      enum: [gestor, colaborador]

    AppUser:
      type: object
      required: [id, clerkUserId, email, role, createdAt]
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string

    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    InstallationEvent:
      type: object
      required: [id, title, startDate, color, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        projectId:
          type: ["integer", "null"]
        teamDescription:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        color:
          type: string
        createdAt:
          type: string

    InstallationEventInput:
      type: object
      required: [title, startDate]
      properties:
        title:
          type: string
        projectId:
          type: integer
        teamDescription:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        notes:
          type: string
        color:
          type: string

    InstallationEventUpdate:
      type: object
      properties:
        title:
          type: string
        projectId:
          type: integer
        teamDescription:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        notes:
          type: string
        color:
          type: string
