openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ulimax — Sistema de Controle de Projetos
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: members
    description: Team member management
  - name: dashboard
    description: Dashboard and summary endpoints
  - name: users
    description: User and role management
  - name: calendario
    description: Installation calendar events
  - name: invitations
    description: Team invite management
  - name: assistencia-tecnica
    description: Technical assistance requests
  - name: templates
    description: Project templates
  - name: notifications
    description: In-app notifications
  - name: attachments
    description: File attachments for tasks and projects
  - name: storage
    description: Object storage upload and serving
  - name: audit-logs
    description: Audit trail of changes
  - name: search
    description: Global search
  - name: tags
    description: Task labels and tags
  - name: task-dependencies
    description: Task blocking dependencies
  - name: time-entries
    description: Task time tracking entries
  - name: automation
    description: Automation rules
  - name: obra-diary
    description: Daily construction diary entries
  - name: reminders
    description: Daily reminder sweep (cobranca automatica)
  - name: assistant
    description: AI assistant for gestores
  - name: project-materials
    description: Project material control
  - name: custom-fields
    description: Custom field definitions and values
  - name: milestones
    description: Project milestones and key dates
  - name: burndown
    description: Weekly task progress data per project
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [a_iniciar, em_projeto, em_aprovacao, em_producao, aguardando_instalacao, em_instalacao]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project (gestor / gestor_obras only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /projects/{id}/unarchive:
    post:
      operationId: unarchiveProject
      tags: [projects]
      summary: Unarchive a project (gestor / gestor_obras only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unarchived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /projects/{id}/approve:
    post:
      operationId: approveProject
      tags: [projects]
      summary: Approve or reject a project (gestor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectApprovalInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /projects/{id}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get task statistics for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{id}/members:
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: List participants of a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
    post:
      operationId: addProjectMember
      tags: [projects]
      summary: Add a participant to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "409":
          description: Already a member

  /projects/{id}/phase-history:
    get:
      operationId: listProjectPhaseHistory
      tags: [projects]
      summary: List phase change history for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Phase history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPhaseHistory"

  /projects/{id}/members/{memberId}:
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a participant from a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /checklist:
    get:
      operationId: listAllChecklistItems
      tags: [checklist]
      summary: List all checklist items across all projects
      responses:
        "200":
          description: List of all checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"

  /projects/{id}/checklist:
    get:
      operationId: listChecklistItems
      tags: [projects]
      summary: List checklist items for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"
    post:
      operationId: createChecklistItem
      tags: [projects]
      summary: Create a checklist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemInput"
      responses:
        "201":
          description: Created checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /projects/{id}/checklist/{itemId}:
    patch:
      operationId: updateChecklistItem
      tags: [projects]
      summary: Update a checklist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemUpdate"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
        "404":
          description: Not found
    delete:
      operationId: deleteChecklistItem
      tags: [projects]
      summary: Delete a checklist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/visits:
    get:
      operationId: listSiteVisits
      tags: [projects]
      summary: List site visits for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of site visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteVisit"
    post:
      operationId: createSiteVisit
      tags: [projects]
      summary: Create a site visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteVisitInput"
      responses:
        "201":
          description: Created site visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteVisit"

  /projects/{id}/visits/{visitId}:
    patch:
      operationId: attachVisitReport
      tags: [projects]
      summary: Attach or remove report file from a site visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachVisitReportInput"
      responses:
        "200":
          description: Updated site visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteVisit"
    delete:
      operationId: deleteSiteVisit
      tags: [projects]
      summary: Delete a site visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/visits/{visitId}/action-items:
    get:
      operationId: listVisitActionItems
      tags: [projects]
      summary: List action items for a visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitActionItem"
    post:
      operationId: createVisitActionItem
      tags: [projects]
      summary: Create an action item for a visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: visitId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitActionItemInput"
      responses:
        "201":
          description: Created action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitActionItem"

  /visit-action-items/{itemId}/toggle:
    patch:
      operationId: toggleVisitActionItem
      tags: [projects]
      summary: Toggle completion of a visit action item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitActionItem"

  /visit-action-items/{itemId}:
    delete:
      operationId: deleteVisitActionItem
      tags: [projects]
      summary: Delete a visit action item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/action-plans:
    get:
      operationId: listProjectActionPlans
      tags: [projects]
      summary: List action plans for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of action plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectActionPlan"
    post:
      operationId: createProjectActionPlan
      tags: [projects]
      summary: Create an action plan for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectActionPlanInput"
      responses:
        "201":
          description: Created action plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectActionPlan"

  /project-action-plans/{planId}:
    delete:
      operationId: deleteProjectActionPlan
      tags: [projects]
      summary: Delete an action plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /project-action-plans/{planId}/items:
    get:
      operationId: listProjectActionItems
      tags: [projects]
      summary: List items for an action plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectActionItem"
    post:
      operationId: createProjectActionItem
      tags: [projects]
      summary: Create an item in an action plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectActionItemInput"
      responses:
        "201":
          description: Created action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectActionItem"

  /project-action-items/{itemId}/toggle:
    patch:
      operationId: toggleProjectActionItem
      tags: [projects]
      summary: Toggle completion of a project action item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectActionItem"

  /project-action-items/{itemId}:
    patch:
      operationId: updateProjectActionItem
      tags: [projects]
      summary: Update a project action item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectActionItemInput"
      responses:
        "200":
          description: Updated action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectActionItem"
    delete:
      operationId: deleteProjectActionItem
      tags: [projects]
      summary: Delete a project action item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/observations:
    get:
      operationId: listProjectObservations
      tags: [projects]
      summary: List observations for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectObservation"
    post:
      operationId: createProjectObservation
      tags: [projects]
      summary: Create an observation for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectObservationInput"
      responses:
        "201":
          description: Created observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectObservation"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, review, done]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: assignedTo
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/bulk-update:
    post:
      operationId: bulkUpdateTasks
      tags: [tasks]
      summary: Bulk update multiple tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskUpdate"
      responses:
        "200":
          description: Number of updated tasks
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer

  /tasks/{id}/subtasks:
    get:
      operationId: listSubtasks
      tags: [tasks]
      summary: List subtasks of a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createSubtask
      tags: [tasks]
      summary: Create a subtask under a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubtaskInput"
      responses:
        "201":
          description: Created subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}/dependencies:
    get:
      operationId: listTaskDependencies
      tags: [task-dependencies]
      summary: List tasks that this task depends on
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of dependency tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDependency"
    post:
      operationId: addTaskDependency
      tags: [task-dependencies]
      summary: Add a dependency (this task blocks on another)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDependencyInput"
      responses:
        "201":
          description: Created dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDependency"

  /tasks/{id}/dependencies/{depId}:
    delete:
      operationId: removeTaskDependency
      tags: [task-dependencies]
      summary: Remove a task dependency
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: depId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/tags:
    post:
      operationId: addTagToTask
      tags: [tags]
      summary: Add a tag to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTagToTaskInput"
      responses:
        "201":
          description: Tag added

  /tasks/{id}/tags/{tagId}:
    delete:
      operationId: removeTagFromTask
      tags: [tags]
      summary: Remove a tag from a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all tags
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a tag
      requestBody:
        required: true
        content:
